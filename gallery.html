<!--JavaScript Codes-->
<script>
    var photos = []; //Declare an empty array to store image elements
    var fileNames = []; //Declare an empty array to store image file names
    var imageList = []; //Declare an empty array to store html list that contain an image
    var image; //Declare an empty variable to store the assembled image list codes
    var openList; //Declare an empty variable to contain open list tag (id is added in the loop)
    var closeList = "</li>"; //Declare a variable to contain close list tag
    var openCaptionTag = "<p class='caption'>"; //Declare a variable to contain open caption tag
    var closeCaptionTag = "</p>"; //Declare a variable to contain close caption tag
    var openDescTag = "<div class='description'>"; //Declare a variable to contain open description tag
    var closeDescTag = "</div>"; //Declare a variable to contain close description tag

    //Caption text for each photo, in the same order as the image files
    var captionTexts = [
        "Loyal Labrador",
        "Snow Husky",
        "Ready To Play",
        "Beagle Puppy",
        "Golden Puppy",
        "Garden Cat",
        "Tiny Kitten",
        "Lop Bunny",
        "Friendly Cockatiel",
        "Backyard Hamster"
    ];

    //Description text for each photo, shown when the mouse is over the photo
    var descTexts = [
        "A yellow Labrador Retriever enjoying the afternoon sun",
        "A Siberian Husky exploring fresh snow in winter",
        "A German Shepherd running through the park",
        "A six week old Beagle puppy on its first walk outside",
        "A Golden Retriever puppy resting on a soft blanket",
        "A tabby cat sitting in the spring grass",
        "A Scottish Fold kitten taking its first steps",
        "A Holland Lop rabbit relaxing on the couch",
        "A cockatiel perched and watching the room",
        "A curious hamster exploring the back yard"
    ];

    //Create a loop to create 10 images starting with index of 0
    for (var i=0; i<10; i++) {
        openList = "<li id='photo"+(i+1)+"'>"; //Create open list tag with a unique id: photo1, photo2 and so on
        fileNames.push("pet"+(i+1)); //Create image file name and store in the array
        photos.push("<img src='images/"+fileNames[i]+".jpg' alt='"+captionTexts[i]+"'>"); //Assemble file name into image element and store in an array
        image = openList + photos[i] + openCaptionTag + captionTexts[i] + closeCaptionTag + openDescTag + descTexts[i] + closeDescTag + closeList; //Assemble image, caption and description with list elements
        imageList.push(image); //Store(push) the assembled list codes into an array
    }

    //Display all ten image codes stored in the array
    document.getElementById("gallery").innerHTML = imageList.join("");
</script>

</body>
